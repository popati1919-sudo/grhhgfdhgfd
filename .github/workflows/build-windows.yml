name: Build Eclipse (Windows, GD 2.2091, Geode 6.0.0-alpha.1)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Eclipse
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This bindings revision is the last one that successfully passed
      # Codegen for this GD 2.2091 / Geode 6 alpha project.
      - name: Build Eclipse
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: "given"
          target: Win64
          build-config: Release
          bindings: geode-sdk/bindings
          bindings-ref: 6d07d9afba68cf7f69cc37f360c4ffe35b1c0cc2
          # Avoid reusing a stale CPM cache containing the broken dependency checkout.
          use-cpm-cache: false

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-windows-gd-2.2091
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14
