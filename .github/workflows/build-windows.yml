name: Build Eclipse (Windows, GD 2.2091, Geode 6.0.0-alpha.1)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GEODE_BINDINGS_REPO_PATH: ${{ github.workspace }}/bindings-pinned
    steps:
      - name: Checkout Eclipse
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone and pin Geode bindings
        shell: bash
        run: |
          git clone https://github.com/geode-sdk/bindings.git bindings-pinned
          git -C bindings-pinned checkout --detach 6d07d9afba68cf7f69cc37f360c4ffe35b1c0cc2

      - name: Build
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: "given"
          target: Win64
          build-config: Release

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-windows-gd-2.2091
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14
